<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Veendam Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f172a;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
}

.slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
    opacity:0;
    visibility:hidden;
    transition:opacity 1s ease;
}

.slide.active{
    opacity:1;
    visibility:visible;
}

.title{
    position:absolute;
    top:30px;
    left:40px;
    font-size:48px;
    color:#38bdf8;
    font-weight:bold;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:50px;
    width:85%;
    max-width:1400px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

.clock{
    font-size:150px;
    font-weight:bold;
}

.date{
    font-size:40px;
    margin-top:20px;
}

.bigtext{
    font-size:60px;
    line-height:1.6;
}

iframe{
    width:100%;
    height:80vh;
    border:none;
    border-radius:20px;
}

.footer{
    position:fixed;
    right:20px;
    bottom:10px;
    font-size:18px;
    color:#94a3b8;
}
</style>
</head>

<body>

<!-- KL0K -->

<section class="slide active">

    <div class="title">🕒 Klok</div>

    <div class="card">

        <div class="clock" id="clock">
            00:00:00
        </div>

        <div class="date" id="date"></div>

    </div>

</section>

<!-- WEER VEENDAM -->

<section class="slide">

    <div class="title">🌦 Weer Veendam</div>

    <div class="card">

        <div class="bigtext" id="weatherVeendam">
            Laden...
        </div>

    </div>

</section>

<!-- WEER GRONINGEN -->

<section class="slide">

    <div class="title">🌤 Weer Groningen</div>

    <div class="card">

        <div class="bigtext" id="weatherGroningen">
            Laden...
        </div>

    </div>

</section>

<!-- RADAR -->

<section class="slide">

    <div class="title">📡 Radar provincie Groningen</div>

    <iframe
        src="https://embed.windy.com/embed2.html?lat=53.22&lon=6.57&zoom=8&level=surface&overlay=radar">
    </iframe>

</section>

<!-- VERKEER A7 -->

<section v class="title">🚗 Verkeer A7</div>

    <div class="card">

        <div class="bigtext">
            Live verkeers-API nog koppelen
            <br><br>
            Weg: A7 Groningen
        </div>

    </div>

</section>

<!-- VERKEER N33 -->

    <div class="title">🚙 Verkeer N33</div>

    <div class="card">

        <div class="bigtext">
            Live verkeers-API nog koppelen
            <br><br>
            Weg: N33 Veendam
        </div>

    </div>

</section>
