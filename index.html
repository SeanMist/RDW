<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Veendam Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Segoe UI, Arial, sans-serif;
    background:#0f172a;
    color:white;
}

#carousel{
    width:100vw;
    height:100vh;
    position:relative;
}

.slide{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.slide.active{
    display:flex;
}

.title{
    position:absolute;
    top:25px;
    left:40px;
    font-size:48px;
    font-weight:bold;
    color:#38bdf8;
}

.card{
    width:90%;
    max-width:1400px;
    background:#1e293b;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,.5);
}

.clock{
    font-size:160px;
    font-weight:bold;
}

.date{
    font-size:44px;
    margin-top:20px;
}

.weather{
    font-size:56px;
    line-height:1.8;
}

.info{
    font-size:48px;
    line-height:1.8;
}

.small{
    font-size:28px;
}

iframe{
    width:95%;
    height:80%;
    border:none;
    border-radius:20px;
}

.footer{
    position:fixed;
    right:20px;
    bottom:10px;
    color:#94a3b8;
    font-size:18px;
}

.news-image{
    width:600px;
    max-width:80%;
    border-radius:20px;
    margin-bottom:20px;
}

</style>
</head>

        </div>
    </section>
