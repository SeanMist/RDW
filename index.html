<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Veendam Dashboard</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f172a;
    color:#fff;
    font-family:Segoe UI, Arial, sans-serif;
}

.slide{
    display:none;
    width:100vw;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.slide.active{
    display:flex;
}

h1{
    font-size:4rem;
    color:#38bdf8;
}

.clock{
    font-size:8rem;
    font-weight:bold;
}

.date{
    font-size:2rem;
}

.weather{
    font-size:3rem;
    text-align:center;
}

iframe{
    width:100vw;
    height:100vh;
    border:none;
}
</style>
</head>
<body>

<!-- Klok -->
<div class="slide active">
    <h1>🕒 Klok</h1>
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
</div>

<!-- Weer Veendam -->
<div class="slide">
    <h1>🌦 Weer Veendam</h1>
    <div class="weather" id="veendam">

</div>

<!-- Weer Groningen -->
<div class="slide">

    <div class="weather" id="groningen">
        Laden...
    </div>
</div>

<!-- Radar -->
<div class="slide">
    <iframe
        src="https://embed.windy.com/embed2.html?lat=53.22&lon=6.85&zoom=8&level=surface&overlay=radar">
    </iframe>
</div>
